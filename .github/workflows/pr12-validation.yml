name: PR12 - WebGL tests and build
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/pr12-rigged-creatures-unique-weapons]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

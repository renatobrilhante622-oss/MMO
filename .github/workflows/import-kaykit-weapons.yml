name: Import KayKit GLB Weapons

on:
  push:
    branches:
      - feature/eterna-kaykit-glb-20261025
    paths:
      - 'scripts/import-kaykit-weapons.mjs'
      - '.github/workflows/import-kaykit-weapons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-weapons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eterna-kaykit-glb-20261025
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build independent, texture-packed CC0 weapon GLBs
        run: node scripts/import-kaykit-weapons.mjs
      - name: Commit verified weapon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/models/KayKit_Weapon_*.glb public/models/kaykit-weapons.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(art): bundle ten texture-packed CC0 weapon models"
            git push origin HEAD:feature/eterna-kaykit-glb-20261025
          fi

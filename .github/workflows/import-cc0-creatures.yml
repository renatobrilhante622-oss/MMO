name: Import audited CC0 creatures
on:
  push:
    branches: [feature/eterna-parte2-art-ui-20261025]
    paths:
      - 'scripts/import-cc0-creatures.mjs'
      - '.github/workflows/import-cc0-creatures.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eterna-parte2-art-ui-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch audited CC0 GLB catalog and verify binary glTF payloads
        run: node scripts/import-cc0-creatures.mjs
      - name: Commit 3D creatures directly to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/models/creatures
          if ! git diff --cached --quiet; then
            git commit -m "chore(assets): ship authentic CC0 creature GLBs and source manifest"
            for attempt in $(seq 1 18); do
              git fetch origin feature/eterna-parte2-art-ui-20261025
              git rebase origin/feature/eterna-parte2-art-ui-20261025
              if git push origin HEAD:feature/eterna-parte2-art-ui-20261025; then
                echo "Pinned creature GLBs committed safely"
                exit 0
              fi
              echo "Branch advanced concurrently; retrying $attempt..."
              sleep 2
            done
            echo "Could not push verified GLB payload after retries"
            exit 1
          fi

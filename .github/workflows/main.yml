name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean Old APKs and Build Fresh Web
        run: |
          if [ -f "MMO/package.json" ]; then
            cd MMO
          fi
          # Apaga todos os APKs antigos congelados do repositório!
          rm -rf dist android/app/src/main/assets/public android/app/build
          rm -f public/*.apk releases/*.apk *.apk
          npm install --legacy-peer-deps
          npm run build
          if [ ! -d "android" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      - name: Build Debug APK
        run: |
          if [ -d "MMO/android" ]; then
            cd MMO/android
          else
            cd android
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Prepare Exact Newly Built APK
        run: |
          mkdir -p apk-output
          if [ -f "MMO/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp MMO/android/app/build/outputs/apk/debug/app-debug.apk apk-output/EternalHero-MMO-vNovo.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/EternalHero-MMO-vNovo.apk
          fi
          ls -lh apk-output/

      - name: Upload APK Ready to Download
        uses: actions/upload-artifact@v4
        with:
          name: EternalHero-MMO-vNovo-APK
          path: apk-output/EternalHero-MMO-vNovo.apk

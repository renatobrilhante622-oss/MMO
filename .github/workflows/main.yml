name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --max-workers=2
      - name: Prepare verified download
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/EternalHero-MMO-debug.apk
          cd apk-output
          sha256sum EternalHero-MMO-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: EternalHero-MMO-Atualizado-APK
          path: apk-output/
          retention-days: 30
          if-no-files-found: error

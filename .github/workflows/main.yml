name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-latest-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean Old APKs and Build Fresh Web
        run: |
          if [ -f "MMO/package.json" ]; then
            cd MMO
          fi
          # Apaga todos os APKs antigos congelados do repositório!
          rm -rf dist android/app/src/main/assets/public android/app/build
          rm -f public/*.apk releases/*.apk *.apk
          npm install --legacy-peer-deps
          npm test
          npm run build
          if [ ! -d "android" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      - name: Build Debug APK
        run: |
          if [ -d "MMO/android" ]; then
            cd MMO/android
          else
            cd android
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Prepare Exact Newly Built APK
        run: |
          mkdir -p apk-output
          if [ -f "MMO/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp MMO/android/app/build/outputs/apk/debug/app-debug.apk apk-output/EternalHero-MMO-vNovo.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/EternalHero-MMO-vNovo.apk
          fi
          ls -lh apk-output/

      - name: Upload APK Ready to Download
        uses: actions/upload-artifact@v4
        with:
          name: ETERNA-Android-Debug-APK
          path: apk-output/EternalHero-MMO-vNovo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest-apk Release (one-click Android download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp apk-output/EternalHero-MMO-vNovo.apk apk-output/ETERNA-Android-latest.apk
          git tag --force latest-apk "${GITHUB_SHA}"
          git push origin refs/tags/latest-apk --force
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release edit latest-apk --title "ETERNA • APK Android atualizado" --notes "Build automático da main. Commit: ${GITHUB_SHA}. APK DEBUG de testes; não é a versão assinada para lojas."
          else
            gh release create latest-apk --title "ETERNA • APK Android atualizado" --notes "Build automático da main. Commit: ${GITHUB_SHA}. APK DEBUG de testes; não é a versão assinada para lojas." --prerelease
          fi
          gh release upload latest-apk apk-output/ETERNA-Android-latest.apk --clobber

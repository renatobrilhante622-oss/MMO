name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and Force Fresh Build Web
        run: |
          if [ -f "MMO/package.json" ]; then
            cd MMO
          fi
          rm -rf dist android/app/src/main/assets/public
          npm install --legacy-peer-deps
          npm run build
          if [ ! -d "android" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      - name: Build Debug APK
        run: |
          if [ -d "MMO/android" ]; then
            cd MMO/android
          else
            cd android
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find and Prepare APK
        run: |
          mkdir -p apk-output
          find . -name "*-debug.apk" -exec cp {} apk-output/EternalHero-MMO-debug.apk \;
          ls -la apk-output/

      - name: Upload APK Ready to Download
        uses: actions/upload-artifact@v4
        with:
          name: EternalHero-MMO-Atualizado-APK
          path: apk-output/EternalHero-MMO-debug.apk

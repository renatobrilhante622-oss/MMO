name: Import verified CC0 dungeon GLBs
on:
  push:
    branches: [feature/eterna-audit-fix-and-releases-20261025]
    paths: [scripts/import-dungeon-glb.mjs, .github/workflows/import-dungeon-glb.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eterna-audit-fix-and-releases-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate origin hashes and embed authentic models
        run: node scripts/import-dungeon-glb.mjs
      - name: Commit real GLBs for offline APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/models/dungeon
          if ! git diff --cached --quiet; then
            git commit -m "chore(dungeon): bundle eleven official CC0 indoor GLBs"
            git push origin HEAD:feature/eterna-audit-fix-and-releases-20261025
          fi

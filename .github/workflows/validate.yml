name: Validate ETERNA gameplay

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Vitest unit and regression suite
        run: npm test
      - name: Strict TypeScript and Vite production build
        run: npm run build

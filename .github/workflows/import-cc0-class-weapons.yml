name: Bundle authentic CC0 ranger bow
on:
  push:
    branches: [feature/eterna-pr10-cinematic-class-hud-20261025]
    paths:
      - scripts/import-cc0-class-weapons.mjs
      - .github/workflows/import-cc0-class-weapons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eterna-pr10-cinematic-class-hud-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and vendor true Kenney CC0 bow and atlas
        run: node scripts/import-cc0-class-weapons.mjs
      - name: Save reviewed offline assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/models/equipment
          if ! git diff --cached --quiet; then
            git commit -m "chore(assets): ship real CC0 longbow and matching atlas"
            for attempt in $(seq 1 20); do
              git fetch origin feature/eterna-pr10-cinematic-class-hud-20261025
              git rebase origin/feature/eterna-pr10-cinematic-class-hud-20261025
              if git push origin HEAD:feature/eterna-pr10-cinematic-class-hud-20261025; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

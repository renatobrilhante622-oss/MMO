name: Import PR11 authentic CC0 weapon packs
on:
  push:
    branches: [feature/eterna-pr11-mount-wing-pet-packs-20261025]
    paths:
      - scripts/import-pr11-weapon-packs.mjs
      - .github/workflows/pr11-weapon-import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eterna-pr11-mount-wing-pet-packs-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download, validate and catalog real CC0 weapon GLB meshes
        run: node scripts/import-pr11-weapon-packs.mjs
      - name: Commit source-verifiable weapon GLBs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/models/weapon-packs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(assets): vendor audited CC0 weapon models for ETERNA"
            for attempt in $(seq 1 22); do
              git fetch origin feature/eterna-pr11-mount-wing-pet-packs-20261025
              git rebase origin/feature/eterna-pr11-mount-wing-pet-packs-20261025
              if git push origin HEAD:feature/eterna-pr11-mount-wing-pet-packs-20261025; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

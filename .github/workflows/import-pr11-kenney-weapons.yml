name: Import verified PR11 Kenney CC0 gear
on:
  push:
    branches: [feature/eterna-pr11-mount-wings-pets-gear-20261025]
    paths: [scripts/import-pr11-kenney-weapons.mjs, .github/workflows/import-pr11-kenney-weapons.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eterna-pr11-mount-wings-pets-gear-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/import-pr11-kenney-weapons.mjs
      - name: Commit immutable real assets for offline APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/models/weapon-packs
          if ! git diff --cached --quiet; then
            git commit -m "chore(gear): include verified four CC0 sword and shield GLBs"
            for attempt in $(seq 1 20); do
              git fetch origin feature/eterna-pr11-mount-wings-pets-gear-20261025
              git rebase origin/feature/eterna-pr11-mount-wings-pets-gear-20261025
              if git push origin HEAD:feature/eterna-pr11-mount-wings-pets-gear-20261025; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

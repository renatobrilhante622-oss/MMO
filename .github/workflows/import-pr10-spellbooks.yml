name: Add authentic KayKit spellbooks
on:
  push:
    branches: [feature/eterna-pr10-cinematic-class-hud-20261025]
    paths:
      - scripts/import-kaykit-weapons.mjs
      - .github/workflows/import-pr10-spellbooks.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eterna-pr10-cinematic-class-hud-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild pinned offline CC0 weapons and spellbooks
        run: node scripts/import-kaykit-weapons.mjs
      - name: Commit two authentic KayKit spellbook meshes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/models/KayKit_Weapon_*.glb public/models/kaykit-weapons.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(art): vendor KayKit open/closed spellbooks for class identity"
            for attempt in $(seq 1 20); do
              git fetch origin feature/eterna-pr10-cinematic-class-hud-20261025
              git rebase origin/feature/eterna-pr10-cinematic-class-hud-20261025
              if git push origin HEAD:feature/eterna-pr10-cinematic-class-hud-20261025; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

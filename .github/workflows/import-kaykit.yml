name: Import CC0 KayKit Models

on:
  push:
    branches:
      - feature/eterna-kaykit-glb-20261025
    paths:
      - 'scripts/import-kaykit-glb.mjs'
      - '.github/workflows/import-kaykit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/eterna-kaykit-glb-20261025
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned official CC0 GLBs with Git blob verification
        run: node scripts/import-kaykit-glb.mjs
      - name: Commit verified binary models to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/models/KayKit_*.glb public/models/kaykit-manifest.json
          if git diff --cached --quiet; then
            echo 'Official assets already present and verified'
          else
            git commit -m "chore(art): bundle seven verified KayKit CC0 GLBs"
            git push origin HEAD:feature/eterna-kaykit-glb-20261025
          fi
